<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="auraNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="50%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Subtle Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1DB954" stroke-opacity="0.25" stroke-width="4" />

  <!-- Outer Glowing Pulse Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#auraNeon)" stroke-width="6" stroke-opacity="0.2" stroke-dasharray="16 10" />

  <!-- Inner Aura Disc Glow -->
  <circle cx="256" cy="256" r="148" fill="#1DB954" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Main Equalizer / Music Sound Wave Graphic forming 'A' -->
  <g filter="url(#glow)">
    <!-- Bar 1 (Left Outer) -->
    <rect x="136" y="216" width="22" height="80" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 2 -->
    <rect x="176" y="164" width="22" height="184" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 3 (Left-Mid High) -->
    <rect x="216" y="112" width="22" height="288" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 4 (Center Apex) -->
    <rect x="256" y="80" width="22" height="352" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 5 (Right-Mid High) -->
    <rect x="296" y="112" width="22" height="288" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 6 -->
    <rect x="336" y="164" width="22" height="184" rx="11" fill="url(#auraNeon)" />

    <!-- Bar 7 (Right Outer) -->
    <rect x="376" y="216" width="22" height="80" rx="11" fill="url(#auraNeon)" />

    <!-- Horizontal Cross Harmonic Bar -->
    <rect x="186" y="270" width="162" height="18" rx="9" fill="#00E5FF" fill-opacity="0.9" />
  </g>
</svg>
